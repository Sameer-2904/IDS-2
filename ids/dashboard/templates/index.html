<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Network IDS Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
    <style>
        body { background-color: #f8f9fa; }
        .section-card { margin-bottom: 1.5rem; }
        #packetRateChart { max-height: 260px; }
        .table-responsive { max-height: 400px; overflow-y: auto; }
        .badge-total { font-size: 1rem; }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <span class="navbar-brand fw-bold">&#128737; Network IDS Dashboard</span>
        <span id="healthBadge" class="badge bg-secondary">Connecting&hellip;</span>
    </div>
</nav>

<div class="container-fluid">

    <!-- Traffic Stats -->
    <div class="card section-card shadow-sm">
        <div class="card-header bg-primary text-white fw-semibold">
            &#128200; Traffic Stats
        </div>
        <div class="card-body">
            <div class="row g-3 mb-3">
                <div class="col-sm-6 col-md-3">
                    <div class="card text-center border-0 bg-light">
                        <div class="card-body py-2">
                            <div class="text-muted small">Total Packets</div>
                            <div id="totalPackets" class="fs-4 fw-bold">&#8212;</div>
                        </div>
                    </div>
                </div>
                <div class="col-sm-6 col-md-3">
                    <div class="card text-center border-0 bg-light">
                        <div class="card-body py-2">
                            <div class="text-muted small">Current PPS</div>
                            <div id="currentPps" class="fs-4 fw-bold">&#8212;</div>
                        </div>
                    </div>
                </div>
            </div>
            <canvas id="packetRateChart"></canvas>
        </div>
    </div>

    <!-- Alerts -->
    <div class="card section-card shadow-sm">
        <div class="card-header bg-danger text-white fw-semibold d-flex justify-content-between align-items-center">
            <span>&#128680; Alerts</span>
            <span class="badge bg-light text-danger badge-total" id="alertTotalBadge">0</span>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover table-sm mb-0" id="alertsTable">
                    <thead class="table-dark sticky-top">
                        <tr>
                            <th>Timestamp</th>
                            <th>Source IP</th>
                            <th>Attack Type</th>
                            <th>Severity</th>
                        </tr>
                    </thead>
                    <tbody id="alertsBody">
                        <tr><td colspan="4" class="text-center text-muted py-3">Loading&hellip;</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Suspicious IPs -->
    <div class="card section-card shadow-sm">
        <div class="card-header bg-warning text-dark fw-semibold">
            &#128270; Suspicious IPs
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover table-sm mb-0" id="suspiciousTable">
                    <thead class="table-dark sticky-top">
                        <tr>
                            <th>IP Address</th>
                            <th>First Seen</th>
                            <th>Last Seen</th>
                            <th>Alert Count</th>
                            <th>Attack Types</th>
                            <th id="blockColHeader" style="display:none;">Action</th>
                        </tr>
                    </thead>
                    <tbody id="suspiciousBody">
                        <tr><td colspan="5" class="text-center text-muted py-3">Loading&hellip;</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Logs -->
    <div class="card section-card shadow-sm">
        <div class="card-header bg-secondary text-white fw-semibold d-flex justify-content-between align-items-center">
            <span>&#128196; Logs</span>
            <span class="badge bg-light text-secondary badge-total" id="logsTotalBadge">0</span>
        </div>
        <div class="card-body">
            <div class="mb-2">
                <input
                    type="text"
                    id="logsFilter"
                    class="form-control form-control-sm"
                    placeholder="Filter by source IP or attack type&hellip;"
                    oninput="filterLogs()"
                />
            </div>
            <div class="table-responsive">
                <table class="table table-hover table-sm mb-0" id="logsTable">
                    <thead class="table-dark sticky-top">
                        <tr>
                            <th>Timestamp</th>
                            <th>Source IP</th>
                            <th>Attack Type</th>
                            <th>Severity</th>
                        </tr>
                    </thead>
                    <tbody id="logsBody">
                        <tr><td colspan="4" class="text-center text-muted py-3">Loading&hellip;</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div><!-- /container-fluid -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>
    window.IDS_IP_BLOCKER_ENABLED = {{ ip_blocker_enabled | tojson }};
</script>
<script>
    // ── Severity → Bootstrap contextual class ──────────────────────────────
    function severityClass(severity) {
        const map = {
            'CRITICAL': 'table-danger',
            'HIGH':     'table-warning',
            'MEDIUM':   'table-info',
            'LOW':      'table-secondary'
        };
        return map[severity] || '';
    }

    function severityBadgeClass(severity) {
        const map = {
            'CRITICAL': 'bg-danger',
            'HIGH':     'bg-warning text-dark',
            'MEDIUM':   'bg-info text-dark',
            'LOW':      'bg-secondary'
        };
        return map[severity] || 'bg-light text-dark';
    }

    // ── Chart.js setup ─────────────────────────────────────────────────────
    const chartCtx = document.getElementById('packetRateChart').getContext('2d');
    const ppsHistory = new Array(60).fill(0);

    const packetRateChart = new Chart(chartCtx, {
        type: 'line',
        data: {
            labels: ppsHistory.map((_, i) => i === 59 ? 'now' : `-${59 - i}s`),
            datasets: [{
                label: 'Packets / second',
                data: [...ppsHistory],
                borderColor: 'rgba(13, 110, 253, 0.9)',
                backgroundColor: 'rgba(13, 110, 253, 0.1)',
                borderWidth: 2,
                pointRadius: 0,
                fill: true,
                tension: 0.3
            }]
        },
        options: {
            animation: false,
            responsive: true,
            maintainAspectRatio: true,
            scales: {
                x: { display: false },
                y: {
                    beginAtZero: true,
                    title: { display: true, text: 'PPS' }
                }
            },
            plugins: {
                legend: { display: false }
            }
        }
    });

    // ── All logs cache (for client-side filtering) ─────────────────────────
    let allLogs = [];

    // ── fetchStats — every 2 s ─────────────────────────────────────────────
    async function fetchStats() {
        try {
            const res = await fetch('/api/stats');
            if (!res.ok) return;
            const data = await res.json();

            document.getElementById('totalPackets').textContent =
                (data.total_packets ?? 0).toLocaleString();
            document.getElementById('currentPps').textContent =
                (data.pps ?? 0).toFixed(1);

            const history = data.pps_history || [];
            while (history.length < 60) history.unshift(0);
            const trimmed = history.slice(-60);

            packetRateChart.data.datasets[0].data = trimmed;
            packetRateChart.update('none');

            document.getElementById('healthBadge').textContent = 'Live';
            document.getElementById('healthBadge').className = 'badge bg-success';
        } catch (e) {
            document.getElementById('healthBadge').textContent = 'Offline';
            document.getElementById('healthBadge').className = 'badge bg-danger';
        }
    }

    // ── fetchAlerts — every 2 s ────────────────────────────────────────────
    async function fetchAlerts() {
        try {
            const res = await fetch('/api/alerts?size=50');
            if (!res.ok) return;
            const data = await res.json();

            const alerts = data.alerts || [];
            const total  = data.total  ?? alerts.length;

            document.getElementById('alertTotalBadge').textContent = total.toLocaleString();

            const tbody = document.getElementById('alertsBody');
            if (alerts.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted py-3">No alerts</td></tr>';
            } else {
                tbody.innerHTML = alerts.map(a => `
                    <tr class="${severityClass(a.severity)}">
                        <td>${escapeHtml(a.timestamp)}</td>
                        <td>${escapeHtml(a.src_ip)}</td>
                        <td>${escapeHtml(a.attack_type)}</td>
                        <td><span class="badge ${severityBadgeClass(a.severity)}">${escapeHtml(a.severity)}</span></td>
                    </tr>`).join('');
            }

            allLogs = alerts;
            document.getElementById('logsTotalBadge').textContent = total.toLocaleString();
            renderLogs();
        } catch (e) {
            // silently ignore network errors
        }
    }

    // ── fetchSuspiciousIPs — every 5 s ─────────────────────────────────────
    async function fetchSuspiciousIPs() {
        try {
            const res = await fetch('/api/suspicious-ips');
            if (!res.ok) return;
            const ips = await res.json();

            ips.sort((a, b) => b.alert_count - a.alert_count);

            const tbody = document.getElementById('suspiciousBody');
            if (ips.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-3">No suspicious IPs</td></tr>';
                return;
            }

            tbody.innerHTML = ips.map(ip => {
                const types = (ip.attack_types || []).map(t => escapeHtml(t)).join(', ');
                const blockBtn = window.IDS_IP_BLOCKER_ENABLED
                    ? `<button class="btn btn-sm btn-outline-danger" onclick="blockIP('${escapeHtml(ip.ip_address)}', this)">Block</button>`
                    : '';
                return `
                    <tr>
                        <td>${escapeHtml(ip.ip_address)}</td>
                        <td>${escapeHtml(ip.first_seen)}</td>
                        <td>${escapeHtml(ip.last_seen)}</td>
                        <td>${ip.alert_count}</td>
                        <td>${types}</td>
                        ${window.IDS_IP_BLOCKER_ENABLED ? `<td>${blockBtn}</td>` : ''}
                    </tr>`;
            }).join('');
        } catch (e) {
            // silently ignore
        }
    }

    // ── filterLogs — client-side filter ───────────────────────────────────
    function filterLogs() {
        renderLogs();
    }

    function renderLogs() {
        const query = (document.getElementById('logsFilter').value || '').trim().toLowerCase();
        const filtered = query
            ? allLogs.filter(a =>
                (a.src_ip    || '').toLowerCase().includes(query) ||
                (a.attack_type || '').toLowerCase().includes(query))
            : allLogs;

        const tbody = document.getElementById('logsBody');
        if (filtered.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted py-3">No matching logs</td></tr>';
            return;
        }
        tbody.innerHTML = filtered.map(a => `
            <tr class="${severityClass(a.severity)}">
                <td>${escapeHtml(a.timestamp)}</td>
                <td>${escapeHtml(a.src_ip)}</td>
                <td>${escapeHtml(a.attack_type)}</td>
                <td><span class="badge ${severityBadgeClass(a.severity)}">${escapeHtml(a.severity)}</span></td>
            </tr>`).join('');
    }

    // ── Block / Unblock IP ─────────────────────────────────────────────────
    async function blockIP(ip, btn) {
        try {
            btn.disabled = true;
            btn.textContent = 'Blocking\u2026';
            const res = await fetch(`/api/block/${encodeURIComponent(ip)}`, { method: 'POST' });
            const data = await res.json();
            if (data.success) {
                btn.textContent = 'Blocked';
                btn.className = 'btn btn-sm btn-secondary';
                btn.onclick = () => unblockIP(ip, btn);
                btn.disabled = false;
            } else {
                btn.textContent = 'Error';
                btn.className = 'btn btn-sm btn-danger';
                btn.title = data.error || 'Unknown error';
                btn.disabled = false;
                setTimeout(() => {
                    btn.textContent = 'Block';
                    btn.className = 'btn btn-sm btn-outline-danger';
                    btn.title = '';
                    btn.onclick = () => blockIP(ip, btn);
                }, 3000);
            }
        } catch (e) {
            btn.textContent = 'Error';
            btn.disabled = false;
        }
    }

    async function unblockIP(ip, btn) {
        try {
            btn.disabled = true;
            btn.textContent = 'Unblocking\u2026';
            const res = await fetch(`/api/unblock/${encodeURIComponent(ip)}`, { method: 'POST' });
            const data = await res.json();
            if (data.success) {
                btn.textContent = 'Unblocked';
                btn.className = 'btn btn-sm btn-outline-success';
                btn.onclick = () => blockIP(ip, btn);
                btn.disabled = false;
            } else {
                btn.textContent = 'Error';
                btn.className = 'btn btn-sm btn-danger';
                btn.title = data.error || 'Unknown error';
                btn.disabled = false;
                setTimeout(() => {
                    btn.textContent = 'Blocked';
                    btn.className = 'btn btn-sm btn-secondary';
                    btn.title = '';
                    btn.onclick = () => unblockIP(ip, btn);
                }, 3000);
            }
        } catch (e) {
            btn.textContent = 'Error';
            btn.disabled = false;
        }
    }

    // ── Helpers ────────────────────────────────────────────────────────────
    function escapeHtml(str) {
        if (str == null) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    // Show block column header if ip_blocker is enabled
    if (window.IDS_IP_BLOCKER_ENABLED) {
        document.getElementById('blockColHeader').style.display = '';
    }

    // ── Polling intervals ──────────────────────────────────────────────────
    setInterval(fetchStats,         2000);
    setInterval(fetchAlerts,        2000);
    setInterval(fetchSuspiciousIPs, 5000);

    // ── Initial load ───────────────────────────────────────────────────────
    fetchStats();
    fetchAlerts();
    fetchSuspiciousIPs();
</script>
</body>
</html>
